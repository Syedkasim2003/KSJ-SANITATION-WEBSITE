<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ksjPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="ksjGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="ksjShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="250" cy="250" r="230" fill="url(#ksjPrimaryGrad)" stroke="url(#ksjGoldGrad)" stroke-width="12" filter="url(#ksjShadow)"/>
  <circle cx="250" cy="250" r="210" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6"/>

  <!-- Water Drop Accent Behind KSJ -->
  <path d="M 250 100 C 270 140 310 190 310 240 C 310 273 283 300 250 300 C 217 300 190 273 190 240 C 190 190 230 140 250 100 Z" fill="url(#ksjGoldGrad)" opacity="0.18"/>

  <!-- Brand Typography -->
  <text x="250" y="240" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="82" fill="#ffffff" text-anchor="middle" letter-spacing="4">KSJ</text>
  
  <text x="250" y="295" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="32" fill="#38bdf8" text-anchor="middle" letter-spacing="6">SANITATION</text>
  
  <!-- Subtext Decorative Ring -->
  <text x="250" y="345" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="16" fill="#94a3b8" text-anchor="middle" letter-spacing="4">FLOWING WITH EXCELLENCE</text>
</svg>
